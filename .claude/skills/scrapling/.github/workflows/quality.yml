name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned Scrapling compatibility environment
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate fenced Python examples
        run: python scripts/validate_markdown.py
      - name: Validate skill structure and evals
        run: python scripts/validate_skill.py
      - name: Verify installed Scrapling API surface
        run: python scripts/verify_upstream.py
      - name: Compile deterministic scripts
        run: python -m compileall -q scripts
