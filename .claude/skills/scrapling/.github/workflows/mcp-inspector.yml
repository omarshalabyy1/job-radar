name: MCP black-box

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-blackbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspector-stdio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
      - name: Install pinned Scrapling compatibility environment
        run: python -m pip install --requirement requirements-dev.txt
      - name: List Scrapling MCP tools through Inspector 2.8.0
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
        run: |
          npx --yes @modelcontextprotocol/inspector@2.8.0 --cli scrapling mcp \
            --method tools/list \
            --format json > /tmp/mcp-tools.json
          python scripts/assert_mcp_inspector_tools.py /tmp/mcp-tools.json
