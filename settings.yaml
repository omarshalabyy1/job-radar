      max_items: 100
      max_charge_usd: 0.15
      input: {keyword: Software Engineer, country: de, postedWithin: "1", maxItems: 100}
    xing:        # shahidirfan/Xing-Jobs-Scraper: $1.00 / 1k, 4.6 stars
      enabled: false
