      max_items: 100
      max_charge_usd: 0.15
      input: {keyword: software engineer, location: "", date_posted: LAST_24_HOURS, results_wanted: 100}
    seek:        # websift/seek-job-scraper: $2.50 / 1k, 4.8 stars (Australia and New Zealand)
      enabled: false
      actor: websift/seek-job-scraper
      max_items: 50
      max_charge_usd: 0.15
      input: {searchTerm: data engineer, maxResults: 50, dateRange: 1, country: australia}
    career_sites:  # fantastic-jobs/career-site-job-listing-api: $12 / 1k + $0.01 a run, direct from 275k company career
      enabled: true  # sites (Workday, Greenhouse, Lever, Ashby...); its smallest run is 10 jobs
