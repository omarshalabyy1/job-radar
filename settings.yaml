    linkedin_egypt_bi:   # Egypt's analyst and BI jobs: the general Egypt search (software OR data ...) is cut by LinkedIn's own result limit
      enabled: true
      actor: valig/linkedin-jobs-scraper
      max_items: 500
      max_charge_usd: 0.3   # was 1 (2026-11-12): a run costs $0.10-0.17, and an account needs the cap plus the margin free to take it
      input: {keywords: data analyst OR business intelligence OR power bi OR BI developer OR reporting analyst OR analytics, location: Egypt, datePosted: r604800, limit: 500}
    linkedin_egypt_ai:
      enabled: true
      actor: valig/linkedin-jobs-scraper
      max_items: 500
      max_charge_usd: 0.3   # was 1 (2026-11-12): a run costs $0.10-0.17, and an account needs the cap plus the margin free to take it
      input: {keywords: AI engineer OR machine learning OR data scientist OR NLP OR LLM OR generative AI OR data engineer, location: Egypt, datePosted: r604800, limit: 500}
    facebook:    # apify/facebook-posts-scraper: $5 / 1k posts; public pages' or groups' links in startUrls, then enable
      enabled: false
      actor: apify/facebook-posts-scraper
      max_items: 30
      max_charge_usd: 0.20
      input: {resultsLimit: 10, onlyPostsNewerThan: 1 day, startUrls: []}

# Claude grading, in the job_radar DAG after embed (ANTHROPIC_API_KEY in .env): the jobs of every place with a
# description, closest to your CV first (embed's free cv_similarity), with no cap, scored 0-10 against your CVs, with the CV to send, one line why and what keeps someone living in
# Cairo from taking it, into core.claude_grade; it also learns from your last 30 clicks in the tracker. A job
# scored 3 or lower is hidden in the tracker and left out of the emails (features.auto_hide; Claude's own restriction
# only with features.eligibility); an 8+ job gets a tailored CV draft. Only a job that has a description is graded (LinkedIn pages
# are never opened: paste the description in /job-radar). A grade made before your newest CV upload counts as ungraded
# and is overwritten on the next run. Haiku was tested and kept only
# 3 of Sonnet's 8 top picks, so Sonnet stays. The task turns red when it selected jobs and graded none (key, credit or
# network), and it stops by itself when the API credit runs out. Switched back on 2026-10-10 (features.grade; off since
# 2026-10-08). No cap since 2026-10-14 (the $200 promotional API credit, expires 2026-11-14): grading and the CV
# drafts take every job they can; the step stops itself before its timeout and the rest wait for the next run.
claude:
  model: claude-sonnet-5-5

# The apply runner (job_radar/apply, docs/superpowers/plans/2026-11-08-auto-apply.md). Off, and dry run, until Omar says go.
apply:
  enabled: true             # the kill switch: false = nothing is picked; so is a file output/apply.stop
  mode: live                # dry_run: fill the form, screenshot, never click submit; live: submit
  score_floor: 5            # Claude's grade (core.claude_grade) at or above this
  places: [Egypt, UAE, Saudi Arabia, Qatar, Kuwait, Bahrain, Oman, Europe, USA, Remote]   # Omar 2026-11-14: Egypt first, then all the Gulf, Europe, the USA; never India or Pakistan (not places)
  max_years: 3              # skip a job that asks for more years (core.job.years_required): Omar's CV shows about 2
  fresh_hours: 48           # only a posting this fresh
  daily_total: 1000          # submits a day, all boards
  per_board: 1000            # submits a day on one board
  board_caps: {}   # lower caps for the two boards that ban automation
  company_days: 0          # one submit per company in this many days
  boards: [greenhouse, lever, ashby, recruitee, linkedin, indeed]            # the allow-list: a new board is a new explicit entry

# The outreach sender (job_radar/outreach_send.py): sends the cold emails outreach_drafts writes, from the Gmail accounts of MAILBOXES in
# .env, under the guardrails of docs/superpowers/plans/2026-11-08-auto-apply.md ("Outreach sender"). Nothing leaves the laptop unless
# enabled is true AND mode is live; dry_run writes each email it would send to output/outreach/outbox/ and sends nothing. A file
# output/outreach.stop also stops it. Omar's go: flip mode to live and enabled to true himself.
outreach:
  enabled: true             # the kill switch: false = nothing is written or sent (Omar, 2026-11-10: dry run on)
  mode: dry_run             # dry_run: write .eml files; live: send through Gmail (needs enabled: true as well)
  daily_total: 20           # emails a day (Cairo day), all mailboxes; a paused mailbox's share of this is removed, not moved
  per_mailbox: 10           # emails a day from one mailbox
  hourly: 5                 # emails in any hour, all mailboxes
  gap_minutes: [2, 10]      # a random wait between two emails, in this range
  work_hours: [9, 17]       # only inside these hours, in the recipient's time zone (Mon-Fri; Sun-Thu in Egypt and Saudi Arabia)
  followup_days: [7, 14]    # the follow-ups: day 7 and day 14 after the first email, then never again
  followup_grace_days: 3    # a follow-up later than this after its day is skipped for good (day 7 is not day 20)
  bounce_limit: 0.03        # bounced recipients over recipients mailed: more pauses that mailbox
  bounce_window_days: 30    # the bounce rate looks back this far (and no further back than the end of the mailbox's last pause)
  pause_days: 7             # a paused mailbox rests this long; a spam complaint also pauses it

# Deep research on Claude Managed Agents, by hand: python -m job_radar.research <job> [key=value ...] (job_radar/research.py).
# Always Haiku. A job's prompt takes {keys} from the command line, else its defaults; a list under `each` runs the job once
# per item when its key is not given. job_id=N adds that job's company, title, location, description and your newest CV.
# The report is written to output/<out>. Change a prompt, a region or a size here; nothing else needs touching.
research:
  model: claude-haiku-5-5
  effort: high
  jobs:
    startups:
      each: {region: [Egypt, Gulf, US, Europe]}
      defaults: {size: 50, count: 15, kinds: "AI, data, analytics and software products"}
      out: research/startups/{region}-{date}.md
      csv: startups/startups.csv   # the report's last csv block is merged into this file, which the tracker's Startups page reads
      prompt: |
        Find up to {count} startups in {region} with about {size} people or fewer, building {kinds}, that hire or may hire
        data engineers, AI engineers or analytics engineers. Check Y Combinator's company directory
        (ycombinator.com/companies, by region and hiring) along with the rest. Skip any that is a staffing firm, an outsourcing shop or has
        shut down. For each give: name, city, headcount (with where you read it), what it does in one line, funding and
        investors if public, careers page link, website, and why it is a fit for a data and AI engineer. Close with the
        sources you could not open and the regions or kinds you found too little for.

        End the report with one ```csv block, nothing after it, one row per startup you verified, with exactly this header:
        region,name,city,size,kind,what,careers,website,source
        region: "{region}", or "{region} (office)" when the startup is headquartered elsewhere and has an office there.
        size: a whole number. kind: "AI/data" or "product". what: one line. careers and website: full links, or empty.
        source: "Managed Agents research {date}". Quote any field that holds a comma.
    founders:
      # {companies}: the startups with a role scored 7+ and no one in data/contacts.csv to write to (outreach.py)
      out: research/founders/{date}.md
      csv: data/contacts.csv   # merged into the tracker's Contacts (a path under data/ is the repo's, not output/)
      prompt: |
        For each of these startups: {companies}
        find the founder or CEO, and the CTO or head of data or engineering when there is one. Read only the company's own
        site (team, about, contact, blog), press interviews, startup databases, conference talks and the people's own sites
        or GitHub. Never use LinkedIn. For each person give name, title and city, and a work email only when it is published
        on a page you read, with that page's URL; never guess an email from a pattern. Say which startups you found no
        published email for.

        End the report with one ```csv block, nothing after it, one row per person, with exactly this header:
        company,side,name,title,location,linkedin,email,why
        company: the startup's name as given above. side: "Founder" for a founder or CEO, "Hiring" for a CTO or head of
        data or engineering. linkedin: always empty. email: a published one, else empty. why: one line ending with the
        source URL. Quote any field that holds a comma.
    interview:
      out: research/interviews/{company} - {title}.md
      prompt: |
        Prepare me for an interview at {company} for the role "{title}" ({location}).

        The posting:
        {description}

        My CV:
        {cv}

        Research the company: what it sells and to whom, its stage, funding, size, leadership, recent news and launches,
        its engineering stack and blog, and how it hires (public interview reports, Glassdoor-style reviews, the process
        steps). Then give: a 10-line company brief; the likely interview rounds; 15 questions they are likely to ask for this
        role, each with a short answer outline drawn from my CV; 8 sharp questions for me to ask them; and the gaps between
        the posting and my CV with how to answer each one honestly. Extra from me: {note}

# Above your level: a title with any of these words is left out (entry, mid and senior stay in)
too_senior: [lead, principal, staff, head, director, manager, vp, chief, architect]

# Never yours, whatever else the title says
never: [data entry, devops, sre, site reliability, technician, teacher, tutor, instructor,
        lecturer, recruiter, accountant, cyber security, cybersecurity, quality assurance, quality control,
        quality inspector, إدخال بيانات*]

# Experience: the email goes from entry to senior as you scroll. The title's words decide first;
# else the years the description asks for; else it is mid level.
experience:
  entry: [intern, internship, trainee, graduate, fresh, entry, junior, jr, متدرب*, حديث التخرج*, مبتدئ*]
  senior: [senior, sr, expert, iii, خبير*]
  entry_max_years: 1    # asks for this many years or fewer: entry and junior
  senior_min_years: 5   # asks for this many years or more: senior
  hide_min_years: 5     # asks for this many years or more: hidden from the tracker and the emails (Omar's CV shows about 2)

