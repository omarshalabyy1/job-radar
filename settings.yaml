          - '(hiring OR "we''re hiring" OR "we are hiring") ("AI engineer" OR "ML engineer" OR "machine learning engineer" OR "LLM engineer" OR "data scientist") (Egypt OR Cairo) -filter:retweets -filter:replies'
          - '(hiring OR "we''re hiring" OR "we are hiring") remote ("data engineer" OR "analytics engineer" OR "data analyst" OR "AI engineer" OR "ML engineer" OR "BI developer") -filter:retweets -filter:replies'
          - '(مطلوب OR "نبحث عن" OR "فرصة عمل" OR "وظيفة شاغرة") ("مهندس بيانات" OR "محلل بيانات" OR "عالم بيانات" OR "ذكاء اصطناعي") -filter:retweets -filter:replies'
          - '(مطلوب OR "فرصة عمل" OR "للتقديم") ("data engineer" OR "data analyst" OR "Power BI" OR "BI developer") (مصر OR القاهرة OR الجيزة OR "عن بعد") -filter:retweets -filter:replies'
    reddit:      # harshmaur/reddit-scraper: $2.00 / 1k posts + $0.02 a run start (Apify Store, 2026-11-08)
      enabled: false  # off 2026-11-12 (Omar): Apify money goes to the 4 Egypt LinkedIn searches only
      actor: harshmaur/reddit-scraper
      max_items: 50             # 6 keywords x 8 posts = 48 posts = $0.096 + $0.02 start = $0.116
      max_charge_usd: 0.15      # the old input (4 whole subreddits x 50 posts) wanted 200 posts = $0.40 and was cut at ~65, all from one subreddit
      posts: {kind: reddit, fresh_days: 3}   # postedAfter '3 days', newest first, is added at run time
      input:
        searchPosts: true
        searchComments: false   # a comment is a billed result too
        searchCommunities: false
        crawlCommentsPerPost: false
        includeNSFW: false
        maxPostsCount: 8        # per keyword
        searchTerms:            # all of Reddit by keyword: r/forhire is mostly people for hire; the filter drops those that slip in
          - hiring data engineer Egypt
          - hiring data analyst Cairo
          - hiring data engineer remote
          - hiring data analyst remote
          - hiring AI engineer remote
