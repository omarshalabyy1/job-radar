# job-radar settings: what to look for, where, and when to email it.
# Edit, save, and the next run uses it (a schedule change shows in Airflow within five minutes).
#
# How words match a job title, a location or a company name:
#   - any case, as whole words:        "ai" matches "AI Engineer", not "Airline"
#   - a trailing * matches word starts: "engineer*" matches engineer, engineers, engineering
#   - a phrase matches as written:      "data engineer*" matches "Senior Data Engineering Lead"
# Secrets (Gmail, inboxes, the warehouse password) stay in .env, never here.

# Egypt is home: onsite and hybrid jobs are kept only there, in onsite_areas below; anywhere else a
# job must be remote. Egypt gets its own email, and every other place shares the second one.

# When it runs, Cairo time, 12-hour style: 11am, 7pm, "7:30pm" ... (the times of one line share
# their minutes). Both emails (Egypt's jobs, and the remote jobs everywhere else) go right after
# each collect. No AI runs on this schedule: Claude only works when you call /job-radar.
schedule:
  collect: [12pm]                       # find new jobs, once a day (every source looks back a day)

# The jobs you want, in your order: the email lists them in this order, and a title takes the
# first role it fits.
#   search:      what Indeed and Bayt are searched for
#   title_needs: the title must have one word from EACH list
roles:
  - name: AI & Data Engineer
    search: [AI Data Engineer, Data AI Engineer, ML Data Engineer]
    title_needs:
      - [data]
      - [ai, ml, genai, llm, llms, machine learning]
      - [engineer*, developer*]

  - name: Data Engineer
    search: [Data Engineer, ETL Developer, Analytics Engineer, Big Data, Data Integration, Data Warehouse,
             Database Developer, Azure Data Engineer, Databricks]
    title_needs:
      - [data engineer*, data integration*, data pipeline*, data platform*, data warehous*,
         data infrastructure*, data migration*, data modeler*, data modeller*, data developer*,
         data quality*, data governance*, dataops*, etl, elt, dwh, big data*, analytics engineer*,
         sql developer*, sql engineer*, database developer*, database engineer*, spark developer*,
         spark engineer*, databricks developer*, databricks engineer*, snowflake developer*,
         snowflake engineer*, informatica developer*, informatica engineer*, ssis developer*,
         ssis engineer*, talend developer*, talend engineer*, hadoop developer*, hadoop engineer*,
         kafka developer*, kafka engineer*, مهندس بيانات*]

  - name: AI Engineer (NLP, LLM, agents, RAG)
    search: [AI Engineer, LLM Engineer, NLP Engineer, Machine Learning Engineer, GenAI Engineer, AI Developer,
             Data Scientist, Generative AI, RAG]
    title_needs:
      - [ai, ml, nlp, llm, llms, genai, gen ai, generative ai, machine learning, deep learning,
         computer vision, rag, agentic, conversational ai, chatbot, prompt, langchain, langgraph,
         data scien*, ذكاء اصطناعي*, تعلم الآلة*]
      - [engineer*, developer*, specialist*, scientist*, programmer*, researcher*, consultant*, intern*,
         trainee*, مهندس*, مطور*, أخصائي*]

  - name: BI Developer
    search: [BI Developer, Power BI, Business Intelligence, Data Visualization, MIS Specialist, Reporting Developer]
    title_needs:
      - [bi, business intelligence*, power bi*, powerbi*, tableau*, qlik*, looker*, ssrs*, mis,
         data visualization*, data visualisation*, dashboard developer*, dashboard designer*,
         dashboard specialist*, dashboard engineer*, dashboard analyst*, dashboards developer*,
         dashboards designer*, dashboards specialist*, dashboards engineer*, dashboards analyst*,
         report developer*, report specialist*, report engineer*, reporting developer*,
         reporting specialist*, reporting engineer*, ذكاء الأعمال*, باور بي*]

  - name: Data Analyst
    search: [Data Analyst, Reporting Analyst, Business Analyst, Analytics Specialist, Product Analyst]
    title_needs:
      - [data analyst*, business analyst*, reporting analyst*, insight analyst*, insights analyst*,
         analytics analyst*, product analyst*, marketing analyst*, quantitative analyst*, data analysis*,
         data analytics*, analytics specialist*, analytics associate*, analytics executive*,
         data specialist*, محلل بيانات*]

# Searched as they are on the sources that take plain words (Himalayas, Workable, Jooble)
search_words: [data engineer, analytics engineer, ETL developer, databricks, AI engineer, machine learning engineer,
               NLP engineer, LLM engineer, generative AI, data scientist, BI developer, power bi, data analyst]

# LinkedIn through an Apify Actor (APIFY_TOKEN in .env; skipped when empty): each word in each place,
# posted in the last day, remote outside Egypt, in one run a collect. Each job costs $0.002 on Apify's
# free plan ($5 credit a month): max_jobs 50 a day is about $3 a month.
linkedin:
  max_jobs: 50
  words: [data engineer, AI engineer, BI developer, data analyst]
  places: {Egypt: Egypt, UAE: United Arab Emirates, Saudi Arabia: Saudi Arabia}

# Claude grading, a side step after each collect (ANTHROPIC_API_KEY in .env): each new job scored 0-10
# against your CVs, the CV to send and one line why, into core.claude_grade. enabled: false turns it off; it
# also stops by itself when the API credit runs out. Sonnet 5.5 at ~100 jobs a day is about $14 a month.
claude:
  enabled: true
  model: claude-sonnet-5-5
  max_jobs: 100

# Above your level: a title with any of these words is left out (entry, mid and senior stay in)
too_senior: [lead, principal, staff, head, director, manager, vp, chief, architect]

# Never yours, whatever else the title says
never: [data entry, mlops, llmops, devops, sre, site reliability, technician, teacher, tutor, instructor,
        lecturer, recruiter, accountant, cyber security, cybersecurity, quality assurance, quality control,
        quality inspector, إدخال بيانات*]

# Experience: the email goes from entry to senior as you scroll. The title's words decide first;
# else the years the description asks for; else it is mid level.
experience:
  entry: [intern, internship, trainee, graduate, fresh, entry, junior, jr, متدرب*, حديث التخرج*, مبتدئ*]
  senior: [senior, sr, expert, iii, خبير*]
  entry_max_years: 1    # asks for this many years or fewer: entry and junior
  senior_min_years: 5   # asks for this many years or more: senior

# The places, in the order the email lists them (after your home and Remote). A location takes the
# first place whose words it has, so keep USA before Europe: "Vienna, Virginia" is the USA.
#   search: where the job boards look, as "search location: Indeed country"
#   words:  how a job's location names the place (for the USA, "US", "USA" and a state code at the
#           end, "Austin, TX", count too)
places:
  - name: Egypt
    search: {Egypt: egypt}
    words: [egypt*, cairo*, giza*]
  - name: UAE
    search: {United Arab Emirates: united arab emirates}
    words: [uae, united arab emirates*, dubai*, abu dhabi*, sharjah*]
  - name: Saudi Arabia
    search: {Saudi Arabia: saudi arabia}
    words: [saudi*, ksa, riyadh*, jeddah*, dammam*, khobar*]
  - name: Qatar
    search: {Qatar: qatar}
    words: [qatar*, doha*]
  - name: Kuwait
    search: {Kuwait: kuwait}
    words: [kuwait*]
  - name: Bahrain
    search: {Bahrain: bahrain}
    words: [bahrain*, manama*]
  - name: Oman
    search: {Oman: oman}
    words: [oman, muscat*]
  - name: USA
    search: {United States: usa}
    words: [united states*, u.s.a, new york, san francisco, seattle, austin, boston, chicago, los angeles,
            denver, atlanta, dallas, houston, miami, washington, san jose, san diego]
  - name: Canada  # after the USA ("Vancouver, WA" is the USA), before Europe ("London, ON, Canada")
    search: {Canada: canada}
    words: [canada*, toronto*, vancouver*, montreal*, montréal*, ottawa*, calgary*, edmonton*, ontario*, quebec*,
            québec*, british columbia*, alberta*]
  - name: Europe
    search: {United Kingdom: uk, Germany: germany, Netherlands: netherlands, Ireland: ireland, France: france,
             Spain: spain, Poland: poland, Sweden: sweden, Switzerland: switzerland, Portugal: portugal}
    words: [united kingdom, uk, england, scotland, wales, london, manchester, germany, berlin, munich, hamburg,
            frankfurt, netherlands, amsterdam, rotterdam, ireland, dublin, france, paris, spain, madrid, barcelona,
            poland, warsaw, krakow, sweden, stockholm, switzerland, zurich, geneva, portugal, lisbon, porto,
            belgium, brussels, austria, vienna, denmark, copenhagen, norway, oslo, finland, helsinki, italy,
            milan, rome, czechia, czech republic, prague, romania, bucharest, greece, athens, europe,
            european union]

# Onsite and hybrid jobs at home: kept in these areas, and when the location names no city;
# left out when it names one of other_home_cities.
onsite_areas: [cairo*, giza*, القاهرة*, الجيزة*, heliopolis*, maadi*, nasr city*, zamalek*, mohandessin*, dokki*,
               6th of october*, 6 october*, october city*, sheikh zayed*, smart village*, fifth settlement*, 5th settlement*]
other_home_cities: [alexandria*, alex, الإسكندرية*, mansoura*, tanta*, assiut*, asyut*, suez*, ismailia*,
                    port said*, damietta*, hurghada*, sharm*, sinai*, aswan*, luxor*, zagazig*, minya*, sohag*,
                    beni suef*, fayoum*, faiyum*, sokhna*, 10th of ramadan*, tenth of ramadan*, sadat city*,
                    bahariya*, marsa alam*, gouna*, matrouh*, alamein*, qena*, banha*, benha*, obour*, badr city*,
                    menoufia*, monufia*, sharqia*, dakahlia*, beheira*, gharbia*, red sea*, new valley*]
# A job is remote when its location or title says one of these (and not "hybrid")
remote_words: [remote*, work from home, wfh, عن بعد*]

# Your companies: a job at any of these is starred (⭐) and listed first
your_companies: [vodafone*, vois, _vois, orange, pwc*, pricewaterhouse*, deloitte*, dhl, nestle*, nestlé*, adib,
                 abu dhabi islamic*, eg bank, egbank, egyptian gulf bank*, etisalat*, e&*, advansys*, nawy,
                 alignerr*, labelbox*, crossover*, sumerge*, finaira*]

