# job-radar settings: what to look for, where, and when to email it.
# Edit, save, and the next run uses it (a schedule change shows in Airflow within five minutes).
#
# How words match a job title, a location or a company name:
#   - any case, as whole words:        "ai" matches "AI Engineer", not "Airline"
#   - a trailing * matches word starts: "engineer*" matches engineer, engineers, engineering
#   - a phrase matches as written:      "data engineer*" matches "Senior Data Engineering Lead"
# Secrets (Gmail, inboxes, the warehouse password) stay in .env, never here.

# Egypt is home: onsite and hybrid jobs are kept only there, in onsite_areas below; anywhere else a
# job must be remote. Egypt gets its own email, and every other place shares the second one.

# When it runs, Cairo time, 12-hour style: 11am, 7pm, "7:30pm" ... (the times of one line share
# their minutes). Both emails (Egypt's jobs, and the remote jobs everywhere else) go right after
# each collect. Claude grades that collect's Egypt jobs (ai_places, claude below) and your mailbox is read every hour for
# your applications; /job-radar is where Claude works with you.
schedule:
  collect: [12pm]                       # find new jobs, once a day (every source looks back a day)

# Each smart feature on or off (true / false). The pipeline follows on its next run; the tracker after `docker restart job-radar-tracker-1`.
features:
  grade: true               # Claude scores each job 0-10 against your CVs (model and daily cap: claude: below)
  eligibility: true         # on: hide jobs someone living in Cairo cannot legally take: the eligibility step reads the board's own
                            # "who can apply" field (Daily Remote, Remotive, Jobicy ...; the extracts never store a job that field bars), else asks Claude Haiku (claude-haiku-5-5, jobs
                            # outside ai_places with a description); the tracker and the emails leave them out (Show hidden jobs shows them)
  auto_hide: true           # hide a job Claude scored 0-3 (needs grade on; a tracker toggle shows them); a restriction hides a job by eligibility alone
  top5: true                # "Top 5 today" at the top of each email
  follow_up: true           # "Follow up" reminders in the Egypt email
  tailor: true              # draft CV, cover letter and notes for scores 8+
  track_applications: true  # read Gmail every hour for news on your applications
  manual_collect_emails: false  # false: only the 12pm collect (and its catch-up) sends the emails; a Trigger only fills the tracker
  embeddings: false         # local Ollama vectors: how close each job is to your CV (CV match); a CV is embedded again only when it changed
  follow_up_drafts: true    # draft a follow-up email (never sent) when an application is 7 or 14 days old with no answer
  interview_prep: true      # draft interview notes when your mailbox shows an interview invite
  market: true              # the website (Fennec): also keep every other tech job (any role, level and country) the sources
                            # bring, with in_scope false; your emails, grades, embeddings and tracker see only in_scope jobs
  market_harvest: true      # the website: also read every company board the other sources' postings link to (grows the
                            # boards waiting to be read, 40 a run; on since 2026-10-17)
  market_more: false        # the website: also every tech job of the remote boards' feeds (Jobicy, Arbeitnow, Remote OK,
                            # Working Nomads) and Germany's job agency (Bundesagentur); the last step of the growth
  outreach_drafts: false    # draft a cold email (never sent) to a startup's founder for its roles scored 7+, when data/contacts.csv
                            # has their email (output/outreach/); find them with python -m job_radar.research founders
# The AI features (grade, tailor, embeddings) run on jobs in these places only. Egypt = Cairo/Giza
# onsite and hybrid and Egypt's remote jobs. Add Remote, UAE ... to widen them.
ai_places: [Egypt]
embeddings:
  model: nomic-embed-text
  url: http://host.docker.internal:11434

# The jobs you want, in your order: the email lists them in this order, and a title takes the
# first role it fits.
#   search:      what Indeed and Bayt are searched for
#   title_needs: the title must have one word from EACH list
roles:
  - name: AI & Data Engineer
    search: [AI Data Engineer, Data AI Engineer, ML Data Engineer]
    title_needs:
      - [data]
      - [ai, ml, genai, llm, llms, machine learning]
      - [engineer*, developer*]

  - name: Data Engineer
    search: [Data Engineer, ETL Developer, Analytics Engineer, Big Data, Data Integration, Data Warehouse,
             Database Developer, Azure Data Engineer, Databricks]
    title_needs:
      - [data engineer*, data integration*, data pipeline*, data platform*, data warehous*,
         data infrastructure*, data migration*, data modeler*, data modeller*, data developer*,
         data quality*, data governance*, dataops*, etl, elt, dwh, big data*, analytics engineer*,
         sql developer*, sql engineer*, database developer*, database engineer*, spark developer*,
         spark engineer*, databricks developer*, databricks engineer*, snowflake developer*,
         snowflake engineer*, informatica developer*, informatica engineer*, ssis developer*,
         ssis engineer*, talend developer*, talend engineer*, hadoop developer*, hadoop engineer*,
         kafka developer*, kafka engineer*, مهندس بيانات*]

  - name: AI Engineer (NLP, LLM, agents, RAG)
    search: [AI Engineer, LLM Engineer, NLP Engineer, Machine Learning Engineer, GenAI Engineer, AI Developer,
             Data Scientist, Generative AI, RAG]
    entry_only: true              # interns and junior titles only (experience.entry words); others are too senior
    generic_cv: generic-ai-intern # never tailored: the apply runner sends output/applications/<this>/ CV
    title_needs:
      - [ai, ml, mlops, llmops, nlp, llm, llms, genai, gen ai, generative ai, machine learning, deep learning,
         computer vision, rag, agentic, conversational ai, chatbot, prompt, langchain, langgraph,
         data scien*, ذكاء اصطناعي*, تعلم الآلة*]
      - [engineer*, developer*, specialist*, scientist*, programmer*, researcher*, consultant*, intern*,
         trainee*, مهندس*, مطور*, أخصائي*]

  - name: BI Developer
    search: [BI Developer, Power BI, Business Intelligence, Data Visualization, MIS Specialist, Reporting Developer]
    title_needs:
      - [bi, business intelligence*, power bi*, powerbi*, tableau*, qlik*, looker*, ssrs*, mis,
         data visualization*, data visualisation*, dashboard developer*, dashboard designer*,
         dashboard specialist*, dashboard engineer*, dashboard analyst*, dashboards developer*,
         dashboards designer*, dashboards specialist*, dashboards engineer*, dashboards analyst*,
         report developer*, report specialist*, report engineer*, reporting developer*,
         reporting specialist*, reporting engineer*, ذكاء الأعمال*, باور بي*]

  - name: Data Analyst
    search: [Data Analyst, Reporting Analyst, Business Analyst, Analytics Specialist, Product Analyst]
    title_needs:
      - [data analyst*, business analyst*, reporting analyst*, insight analyst*, insights analyst*,
         analytics analyst*, product analyst*, marketing analyst*, quantitative analyst*, data analysis*,
         data analytics*, analytics specialist*, analytics associate*, analytics executive*,
         data specialist*, محلل بيانات*,
         # titles the rule missed in Egypt (2026-11-14: PwC, IBM, Darsel, Property Finder, PepsiCo, DXC; Omar applied to four by hand)
         "data & analytics*", data and analytics*, data systems analyst*, data operations*, microsoft analytics*,
         analytics cloud*, analytics consultant*, marketing science analyst*, "strategy & operations analyst*",
         strategy and operations analyst*]

# Searched as they are on the sources that take plain words (Himalayas, Workable, Jooble)
search_words: [data engineer, analytics engineer, ETL developer, databricks, AI engineer, machine learning engineer,
               NLP engineer, LLM engineer, generative AI, data scientist, BI developer, power bi, data analyst]

# LinkedIn through an Apify Actor (APIFY_TOKEN in .env; skipped when empty): each word in each place,
# posted in the last day, remote outside Egypt, in one run a collect. Each job costs $0.002 on Apify's
# free plan ($5 credit a month): max_jobs 50 a day is about $3 a month.
linkedin:
  max_jobs: 50
  # a run that worked holds the next for this many hours: a manual collect the same day costs nothing
  every_hours: 1
  words: [data engineer, AI engineer, BI developer, data analyst]
  places: {Egypt: Egypt, UAE: United Arab Emirates, Saudi Arabia: Saudi Arabia}

# The website's hard boards and social hiring posts through Apify Actors (sources/apify.py, the extract_apify step), every
# tech job, for the website. APIFY_TOKENS in .env lists the Apify accounts (5 on 2026-10-29: $10 + $10 + $5 + $5 + $5 a
# month); each run goes to the account with the most left after its max_charge_usd and margin_usd, read from Apify's own
# usage and limit, so no account passes its limit. A run stops at max_items jobs and at max_charge_usd. Price: dollars per
# 1,000 items (Apify Store, 2026-10-29). At max_items a day for 30 days the enabled boards cost about: linkedin $2.40,
# linkedin_gulf $2.40, indeed $0.30, glassdoor $1.20, stepstone $3, xing $3, career_sites $3.90, x $1.10, reddit $3.50
# wellfound $4.50, seek $3.75 (~$29, plus ~$3 for the LinkedIn leg above, inside the ~$35 the five accounts get a
# month). X and Reddit return posts, not listings, and are filtered before anything is stored (posts: below, sources/social.py):
# only a post that says someone is hiring, names one of your roles (roles above) and gives a company, an apply link or a
# contact is kept; retweets, job seekers, reposts of the same text and posts over fresh_days old are dropped, and each run
# logs how many of each. They were off from 2026-10-29 (every post, a for-hire post too, was stored as a job) until this filter.
# Each run prints its cost (Apify's own figure) and the collect ends with one spend line. Off: facebook (the
# Egypt job pages found on 2026-10-29 last posted in 2021-2025; add active public groups or pages, then enable).
apify:
  margin_usd: 0.1
  every_hours: 1  # a board that ran waits this long: a run reads every board (Omar, 2026-11-10; was 20)
  boards:
    linkedin:    # valig/linkedin-jobs-scraper: $0.40 / 1k, 4.7 stars, 36k users (tested 2026-10-29)
      enabled: true
      actor: valig/linkedin-jobs-scraper
      max_items: 1000
      max_charge_usd: 0.3   # was 1 (2026-11-12): a run costs $0.10-0.17, and an account needs the cap plus the margin free to take it
      input: {keywords: software OR data OR developer OR engineer, location: Egypt, datePosted: r604800, limit: 1000}  # 7 days: its 24-hour search gives 0 for Egypt (tested 2026-10-29); a link already stored is skipped
    linkedin_gulf:
      enabled: false  # off 2026-11-12 (Omar): Apify money goes to the 4 Egypt LinkedIn searches only
      actor: valig/linkedin-jobs-scraper
      max_items: 1000
      max_charge_usd: 1
      input: {keywords: data OR analytics OR AI OR BI, location: United Arab Emirates, datePosted: r604800, limit: 1000}
    indeed:      # valig/indeed-jobs-scraper: $0.10 / 1k, 4.7 stars, 35k users
