    x:           # kaitoeasyapi/twitter-x-data-tweet-scraper-pay-per-result-cheapest: $0.25 / 1k tweets, no start fee (Apify Store, 2026-11-08)
      enabled: false  # off 2026-11-12 (Omar): Apify money goes to the 4 Egypt LinkedIn searches only
      actor: kaitoeasyapi/twitter-x-data-tweet-scraper-pay-per-result-cheapest
