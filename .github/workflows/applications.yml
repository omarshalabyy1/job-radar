# Your applications, as your Gmail tells them, on Fennec within two hours, with no laptop running. Every 2 hours, at 7
# minutes past (GitHub may start a run late and drops one when it is busy):
#   - the same steps as the laptop's job_radar_applications DAG (dags/job_radar.py): track_applications reads each Gmail
#     account's All Mail over IMAP, read-only (nothing is marked read, moved or deleted), into core.application_email of a
#     fresh Postgres, seeded from Neon first (job_radar/seed.py) so an email already published is not read again;
#   - then publish_applications (job_radar/publish_applications.py) copies the emails to tracker.application_email on
#     Neon and moves each matched job's status in app.job_status up (applied, interview, rejected, offer), never down.
# No ANTHROPIC_API_KEY here: the emails no pattern fits are not sent to Claude (Neon keeps no row for them, so they would
# be asked again on every run); the laptop's own run still classifies them. No draft or interview notes are written.
# Minutes: a private repository has 2,000 free Actions minutes a month. A run takes about 70 seconds, billed as 2 minutes:
# 12 runs a day is about 720 a month; the collect (daily-backup.yml) is about 13 minutes twice a day, 780. The first step
# adds up the month's minutes from the run list (the run times, rounded up per run) and, at 1,700 or more, runs only every
# 4th hour (UTC 0, 4, 8, ...: half the runs, as the schedule is every 2nd hour); at 1,950 or more it skips, so the month
# never stops without warning.
# Separate from the collect: its own concurrency group, so a slow collect never holds this back.
# Secrets (Settings > Secrets and variables > Actions): NEON_DATABASE_URL, MAILBOXES, GMAIL_USER, GMAIL_APP_PASSWORD,
# APPLICATION_SENDERS, OWNER_EMAIL: the same values as job-radar's .env. GitHub runs a schedule only from the default
# branch (main). Run it by hand from the Actions tab (Run workflow); a run by hand always reads.

name: applications

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

concurrency:
  group: applications
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # the run list, for the month's minutes

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      warehouse:
        image: postgres:17
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar  # a throwaway database that ends with the run: not a secret
          POSTGRES_DB: jobradar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      WAREHOUSE_HOST: 127.0.0.1
      WAREHOUSE_PORT: "5433"
      WAREHOUSE_PASSWORD: jobradar
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      MAILBOXES: ${{ secrets.MAILBOXES }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      APPLICATION_SENDERS: ${{ secrets.APPLICATION_SENDERS }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Minutes left this month
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          used=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?created=>=$(date -u +%Y-%m)-01&per_page=100"             --jq '.workflow_runs[] | select(.status == "completed") | (((.updated_at | fromdate) - (.run_started_at | fromdate)) / 60 | ceil)'             | awk '{s += $1} END {print s + 0}')
          hour=$(date -u +%-H)
          echo "about $used of 2000 minutes used this month"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$used" -lt 1700 ] || { [ "$used" -lt 1950 ] && [ $((hour % 4)) -eq 0 ]; }; then
            echo "read=true" >> "$GITHUB_OUTPUT"
          else
            echo "read=false" >> "$GITHUB_OUTPUT"; echo "near the month's limit: this run is skipped"
          fi
      - if: steps.budget.outputs.read == 'true'
        uses: actions/checkout@v4
      - if: steps.budget.outputs.read == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # the Dockerfile's
          cache: pip
          cache-dependency-path: requirements.txt
      - if: steps.budget.outputs.read == 'true'
        name: Install
        run: pip install -r requirements.txt
      - if: steps.budget.outputs.read == 'true'
        name: Schema and seed from Neon
        run: |
          python -m job_radar schema
          python -m job_radar.seed
      - if: steps.budget.outputs.read == 'true'
        name: Read Gmail
        run: python -m job_radar track_applications
      - if: steps.budget.outputs.read == 'true'
        name: Publish to Neon
        run: python -m job_radar publish_applications
