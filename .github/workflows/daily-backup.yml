# The main collect for the website (Fennec): Airflow on the laptop is stopped, so GitHub collects and publishes to Neon
# (the website's database) every 4 hours, at 17 minutes past 3, 7, 11, 15, 19 and 23 UTC (off the hour, as GitHub delays
# top-of-hour schedules). Each run does the same steps as dags/job_radar.py on a fresh Postgres, seeded from Neon first
# (job_radar/seed.py: every Neon job with its own job_key, marked emailed), so a job Neon already has is matched by its
# job_key, never added twice, and published under the same id (made from job_key). Every extract_ step in
# job_radar/__main__.py's STEPS runs, so a new collector needs no change here; one without its secret here (LinkedIn's
# Apify, your mailboxes) skips itself. No Claude step and no email runs. publish runs with PUBLISH_PRUNE=0: it deletes
# nothing on Neon. After each publish, publish.py asks the website for the instant Telegram push (CRON_SECRET).
# Two runs never overlap (concurrency). Secrets (Settings > Secrets and variables > Actions): NEON_DATABASE_URL,
# CRON_SECRET (the website's, same value as radar-web's); JOOBLE_API_KEY, optional. GitHub runs a schedule only from the
# default branch (main). Run it by hand from the Actions tab (Run workflow).

name: daily-backup

on:
  schedule:
    - cron: "17 3,7,11,15,19,23 * * *"
  workflow_dispatch:

concurrency:
  group: daily-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 75  # 12 extracts of up to 150 s each (210 s watchdog), describe, install: about 45 minutes
    services:
      warehouse:
        image: postgres:17
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar  # a throwaway database that ends with the run: not a secret
          POSTGRES_DB: jobradar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      WAREHOUSE_HOST: 127.0.0.1
      WAREHOUSE_PORT: "5433"
      WAREHOUSE_PASSWORD: jobradar
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PUBLISH_PRUNE: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # the Dockerfile's
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Schema and seed from Neon
        run: |
          python -m job_radar schema
          python -m job_radar.seed
      - name: Collect
        # as the DAG runs them: one at a time; a step that fails is a warning and the next still runs (all_done)
        run: |
          extracts=$(python -c "from job_radar.__main__ import STEPS; print(' '.join(s for s in STEPS if s.startswith('extract_')))")
          for step in $extracts transform describe match_skills eligibility; do
            timeout 600 python -m job_radar "$step" || echo "::warning::$step ended with exit code $?"
          done
      - name: Publish to Neon
        run: python -m job_radar publish
