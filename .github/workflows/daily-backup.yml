# The main collect for the website (Fennec). GitHub collects and publishes to Neon (the website's database) twice a
# day, at 17 minutes past 6 and 18 UTC (9am and 9pm in Cairo in summer) (off the hour, as GitHub delays top-of-hour schedules). Airflow on the laptop may
# collect too; when it has, this waits:
#   gate    a run skips when a publish landed on Neon in the last 6 hours, from Airflow or from this workflow. The marker is
#           the 'publish' row in tracker.step_run that publish.py writes (job_radar/publish.py): jobs.job.first_seen is a
#           date and does not move when a collect finds nothing new. 6 hours, not 8: this workflow publishes about 45
#           minutes into its run, and a gate of 7 or more would make its own next slot, 8 hours later, skip on a slow day.
#           A run started by hand always collects.
#   backup  the same steps as dags/job_radar.py on a fresh Postgres, seeded from Neon first (job_radar/seed.py: every Neon
#           job with its own job_key, marked emailed), so a job Neon already has is matched by its job_key, never added
#           twice, and published under the same id (made from job_key). Every extract_ step in job_radar/__main__.py's STEPS
#           runs, so a new collector needs no change here; one without its secret here (LinkedIn's Apify, your mailboxes)
#           skips itself. No Claude step and no email runs. publish prunes: Neon keeps the last 5 days of jobs (publish.py KEEP_DAYS) plus every job a user saved or tracked.
#           After the publish, publish.py asks the website for the instant Telegram push (CRON_SECRET).
# Two runs never overlap (concurrency). Secrets (Settings > Secrets and variables > Actions): NEON_DATABASE_URL,
# CRON_SECRET (the website's, the same value as radar-web's); JOOBLE_API_KEY and APIFY_TOKENS (comma-separated), optional. GitHub runs a schedule only from
# the default branch (main). Run it by hand from the Actions tab (Run workflow).

name: daily-backup

on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:

concurrency:
  group: daily-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.neon.outputs.run }}
    steps:
      - name: Did a publish reach Neon in the last 6 hours?
        id: neon
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          # the error is shown with any url in it replaced: a connection error can quote the url
          recent=$(psql "$NEON_DATABASE_URL" -tAc "SELECT coalesce(max(finished_at) > now() - interval '6 hours', false) FROM tracker.step_run WHERE step = 'publish' AND status = 'ok'" 2>gate.err)             || { echo "::error::cannot reach Neon: $(sed -E 's#postgres(ql)?://[^ ]*#<url>#g' gate.err | head -3)"; exit 1; }
          if [ "$recent" = "t" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "a publish is less than 6 hours old: skipping this slot"
          else echo "run=true" >> "$GITHUB_OUTPUT"; echo "no publish in the last 6 hours: collecting"; fi

  backup:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75  # 12 extracts of up to 150 s each (210 s watchdog), describe, install: about 45 minutes
    services:
      warehouse:
        image: postgres:17
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar  # a throwaway database that ends with the run: not a secret
          POSTGRES_DB: jobradar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      WAREHOUSE_HOST: 127.0.0.1
      WAREHOUSE_PORT: "5433"
      WAREHOUSE_PASSWORD: jobradar
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APIFY_TOKENS: ${{ secrets.APIFY_TOKENS }}  # optional: LinkedIn's search and the Apify boards, spread over the accounts
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # the Dockerfile's
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Keep the sources' holds between runs  # else LinkedIn's 20-hour Apify hold is forgotten and it runs every collect
        uses: actions/cache/restore@v4
        with:
          path: output/waits
          key: waits-${{ github.run_id }}
          restore-keys: waits-
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Schema and seed from Neon
        run: |
          python -m job_radar schema
          python -m job_radar.seed
      - name: Collect
        # as the DAG runs them: one at a time; a step that fails is a warning and the next still runs (all_done)
        run: |
          extracts=$(python -c "from job_radar.__main__ import STEPS; print(' '.join(s for s in STEPS if s.startswith('extract_')))")
          for step in $extracts transform describe match_skills eligibility; do
            limit=600; [ "$step" = extract_apify ] && limit=1800  # a run per Apify board, each up to 4 minutes
            timeout $limit python -m job_radar "$step" || echo "::warning::$step ended with exit code $?"
          done
      - name: Publish to Neon
        run: python -m job_radar publish
      - name: Save the sources' holds  # always: a failed publish must not make the next run pay for Apify again
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/waits
          key: waits-${{ github.run_id }}
