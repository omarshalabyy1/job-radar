<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1205" width="1000" height="1205" role="img" aria-label="The table model, rows on 6 October 2026. core.job (688 rows, one per job, key job_id, natural key job_key, the normalized title and company, with posted_at, company_size, restriction and cv_similarity) has one core.application row at most (0 rows), one core.claude_grade row at most (Claude's 0-10 score, the CV to send, a reason and any restriction), one core.job_vector row at most (its local embedding) and many core.job_skill rows (2,403), each naming a skill of core.skill (54). core.cv (0) has many core.cv_skill rows (0) and one core.cv_vector row at most. core.application_email has one row per mailbox email, keyed by message_id, and points at a core.job when it names one; the row stays if the job is deleted. raw.job_posting (4,143 rows, one per source and link) folds into core.job by job_key in transform, and core.company (121) marks a job's company by name. core.job_seen keeps the job_key of each deleted job, so it is never stored again; core.email_seen keeps the Message-ID of each email with no job for 7 days; core.step_run has one row per step per run, keyed by step and start time, with its status, summary, Claude tokens and exact dollars. The tables added since 6 October have no row count here, nor has core.job_seen. Solid lines are foreign keys; dashed lines are joins the code makes without a constraint.">
