  <text x="40" y="1125" class="where">Solid: a foreign key in sql/schema.sql. Dashed: a join the code makes with no constraint (skill kept as text so the list can change;</text>
  <text x="40" y="1144" class="where">transform folds postings into one job by job_key, the normalized title and company; job_seen keeps a deleted job's key; a starred company marks its jobs by name).</text>
  <text x="40" y="1163" class="where">Rows are those of 6 October 2026; the tables added since show a purpose, not a count. application_email keeps its row when its job is deleted.</text>
  <text x="40" y="1182" class="where">PK primary key &#183; FK foreign key &#183; UK unique, the natural key &#183; 1 to * one row to many &#183; 0..1 at most one</text>
</svg>
