<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 948" width="1000" height="948" role="img" aria-label="Data flow, table by table, rows on 6 October 2026: the Airflow DAG job_radar runs ten extract tasks side by side (Indeed and Jooble, Bayt, 10 remote boards, Wuzzuf and Tanqeeb, NaukriGulf GulfTalent and Dubizzle, Workable, freehire.me, your companies' career pages, the 28,000-company feed and your Gmail alerts) into raw.job_posting (4,143 rows, each posting once by source and link). transform keeps one row per job in core.job (688 rows), describe adds descriptions and match_skills stores core.job_skill (2,403) and core.cv_skill (0) from core.skill (54 skills). core.company (121) comes from settings.yaml, core.cv (0) and core.application (0) from the tracker. The mart views job_status (688), skill_demand (186) and jobs_daily (259) feed the tracker, the two emails, the career-ops export and SQL.">
