<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 994" width="1000" height="994" role="img" aria-label="Data flow, table by table, rows on 6 October 2026: the Airflow DAG job_radar runs twelve extract tasks one by one (Indeed and Jooble, Bayt, 10 remote boards, Wuzzuf and Tanqeeb, NaukriGulf GulfTalent and Dubizzle, Workable, freehire.me, your companies' career pages, the 28,000-company feed, your Gmail alerts, 5 startup platforms, and LinkedIn search through Apify) into raw.job_posting (4,143 rows, each posting once by source and link). transform keeps one row per job in core.job (688 rows) and the key of each deleted job in core.job_seen, describe adds descriptions and match_skills stores core.job_skill (2,403) and core.cv_skill (0) from core.skill (54 skills). core.company (121) comes from settings.yaml, core.cv (0) and core.application (0) from the tracker. The mart views job_status (688), skill_demand (186) and jobs_daily (259) feed the tracker (Jobs, Dashboard, Skills in demand, Companies, CV), the two emails, the career-ops export and SQL. core.claude_grade is written by job_radar_grade_claude, which is off. extract_startups, extract_linkedin, core.job_seen and core.claude_grade have no count here.">
