<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="How it works: 01 Collect, job boards, job APIs, 200+ career pages and your Gmail alerts; 02 Rank, your roles, places and level, one row per job, your skills matched; 03 Email, two digests (Egypt, outside Egypt), junior to senior, each job sent once; 04 Apply, /job-radar in Claude Code reviews, tailors and applies with your yes per job.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .num { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .step { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .desc { font-size: 13px; fill: #94A3B8; }
    .cap { font-size: 12px; fill: #64748B; }
    .link { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>

  <rect width="1000" height="290" rx="22" fill="url(#bg)"/>
  <text x="50" y="52" class="title">How it works</text>
  <text x="50" y="76" class="sub">Airflow collects and ranks twice a day, on its own. Claude joins when you call it.</text>

  <path class="link" d="M255 175h30"/>
  <path class="link" d="M490 175h30"/>
  <path class="link" d="M725 175h30"/>

  <!-- 01 -->
  <rect x="50" y="105" width="205" height="140" rx="14" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.7"/>
  <circle cx="84" cy="140" r="18" fill="#3B82F6" fill-opacity="0.35"/>
  <text x="84" y="145" class="num" text-anchor="middle">01</text>
  <text x="112" y="146" class="step">Collect</text>
  <text x="70" y="184" class="desc">Job boards, job APIs,</text>
  <text x="70" y="203" class="desc">200+ career pages and</text>
  <text x="70" y="222" class="desc">your Gmail job alerts</text>

  <!-- 02 -->
  <rect x="285" y="105" width="205" height="140" rx="14" fill="#14B8A6" fill-opacity="0.08" stroke="#14B8A6" stroke-opacity="0.7"/>
  <circle cx="319" cy="140" r="18" fill="#14B8A6" fill-opacity="0.35"/>
  <text x="319" y="145" class="num" text-anchor="middle">02</text>
  <text x="347" y="146" class="step">Rank</text>
  <text x="305" y="184" class="desc">Your roles, places, level;</text>
  <text x="305" y="203" class="desc">one row per job, scored</text>
  <text x="305" y="222" class="desc">by the skills you have</text>

  <!-- 03 -->
  <rect x="520" y="105" width="205" height="140" rx="14" fill="#A855F7" fill-opacity="0.08" stroke="#A855F7" stroke-opacity="0.7"/>
  <circle cx="554" cy="140" r="18" fill="#A855F7" fill-opacity="0.35"/>
  <text x="554" y="145" class="num" text-anchor="middle">03</text>
  <text x="582" y="146" class="step">Email</text>
  <text x="540" y="184" class="desc">Egypt, and outside Egypt:</text>
  <text x="540" y="203" class="desc">junior to senior, your</text>
  <text x="540" y="222" class="desc">companies first, sent once</text>

  <!-- 04 -->
  <rect x="755" y="105" width="205" height="140" rx="14" fill="#22C55E" fill-opacity="0.08" stroke="#22C55E" stroke-opacity="0.7"/>
  <circle cx="789" cy="140" r="18" fill="#22C55E" fill-opacity="0.35"/>
  <text x="789" y="145" class="num" text-anchor="middle">04</text>
  <text x="817" y="146" class="step">Apply</text>
  <text x="775" y="184" class="desc">/job-radar in Claude Code:</text>
  <text x="775" y="203" class="desc">review, tailor your CV,</text>
  <text x="775" y="222" class="desc">apply with your yes</text>

  <text x="500" y="272" class="cap" text-anchor="middle">Apache Airflow &#183; PostgreSQL raw &#8594; core &#8594; mart &#183; tracker on 127.0.0.1:8501</text>
</svg>
