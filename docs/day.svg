<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="A day with job-radar, Cairo time: Airflow collects at 11am (with Workable's one search of the day) and 7pm, and sends both emails 30 minutes later, at 11:30am and 7:30pm. Claude works only when you type /job-radar, at any time.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .hour { font-size: 11.5px; fill: #64748B; }
    .label { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    .note { font-size: 12px; fill: #94A3B8; }
    .ping { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(2.6); opacity: 0; } }
    .any { fill: none; stroke: #22C55E; stroke-width: 2; stroke-dasharray: 3 7; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>

  <rect width="1000" height="250" rx="22" fill="url(#bg)"/>
  <text x="50" y="52" class="title">A day with job-radar</text>
  <text x="50" y="76" class="sub">Cairo time. Two collects, each followed by both emails; Claude whenever you call it.</text>

  <!-- the day: 12am to 12am, x = 70 + 35.83 per hour -->
  <line x1="70" y1="150" x2="930" y2="150" stroke="#334155" stroke-width="2"/>
  <g class="hour" text-anchor="middle">
    <text x="70" y="172">12am</text>
    <text x="177.5" y="172">3am</text>
    <text x="285" y="172">6am</text>
    <text x="392.5" y="172">9am</text>
    <text x="500" y="172">12pm</text>
    <text x="607.5" y="172">3pm</text>
    <text x="715" y="172">6pm</text>
    <text x="822.5" y="172">9pm</text>
    <text x="930" y="172">12am</text>
  </g>

  <!-- 11am collect and 11:30am emails -->
  <line x1="464" y1="150" x2="464" y2="114" stroke="#3B82F6" stroke-opacity="0.6"/>
  <circle cx="464" cy="150" r="7" fill="#3B82F6" class="ping"/>
  <circle cx="464" cy="150" r="7" fill="#3B82F6"/>
  <text x="456" y="108" class="label" text-anchor="end">11am collect</text>
  <text x="456" y="125" class="note" text-anchor="end">+ Workable, once a day</text>
  <circle cx="482" cy="150" r="6" fill="#A855F7"/>
  <text x="492" y="108" class="label">11:30am emails</text>
  <line x1="482" y1="150" x2="482" y2="114" stroke="#A855F7" stroke-opacity="0.6"/>

  <!-- 7pm collect and 7:30pm emails -->
  <line x1="751" y1="150" x2="751" y2="114" stroke="#3B82F6" stroke-opacity="0.6"/>
  <circle cx="751" cy="150" r="7" fill="#3B82F6" class="ping" style="animation-delay:1.2s"/>
  <circle cx="751" cy="150" r="7" fill="#3B82F6"/>
  <text x="743" y="108" class="label" text-anchor="end">7pm collect</text>
  <circle cx="769" cy="150" r="6" fill="#A855F7"/>
  <line x1="769" y1="150" x2="769" y2="114" stroke="#A855F7" stroke-opacity="0.6"/>
  <text x="779" y="108" class="label">7:30pm emails</text>

  <!-- Claude, any time -->
  <path class="any" d="M70 200 H930"/>
  <rect x="380" y="186" width="240" height="28" rx="14" fill="#0F172A" stroke="#22C55E" stroke-opacity="0.7"/>
  <text x="500" y="205" class="label" text-anchor="middle" style="fill:#4ADE80">/job-radar &#183; Claude, any time</text>
  <text x="500" y="234" class="note" text-anchor="middle">A collect takes 3 to 5 minutes; each job reaches you once.</text>
</svg>
